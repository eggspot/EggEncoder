name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # windows-latest — EggEncoder.UnitTests exercises NativeEncoder, which P/Invokes into
    # win-x64 native binaries (libmp3lame.dll, libFLAC.dll) that won't load on Linux/macOS runners.
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: ['8.0.x', '9.0.x', '10.0.x']

    steps:
      - uses: actions/checkout@v4

      # Install all required SDKs so every TFM (including net10.0) can be compiled
      # regardless of which runtime version the matrix is currently testing.
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (all target frameworks)
        run: dotnet build --configuration Release --no-restore

      - name: Test (.NET ${{ matrix.dotnet-version }})
        shell: bash
        run: |
          MAJOR=$(echo "${{ matrix.dotnet-version }}" | cut -d. -f1)
          dotnet test --configuration Release --no-build --framework "net${MAJOR}.0" --verbosity normal

      # EggEncoder.AotSmokeTest only targets net10.0, so this only needs to run once regardless
      # of which SDK the matrix leg is testing. A real `PublishAot=true` publish (not just a
      # build) is required to catch trimming/AOT issues the Roslyn analyzer alone would miss —
      # e.g. in the NLayer MP3 decoder dependency, which ships no AOT/trim metadata of its own.
      - name: Publish Native AOT smoke test (.NET 10)
        if: matrix.dotnet-version == '10.0.x'
        run: dotnet publish src/EggEncoder.AotSmokeTest/EggEncoder.AotSmokeTest.csproj --configuration Release --runtime win-x64

      - name: Run Native AOT smoke test (.NET 10)
        if: matrix.dotnet-version == '10.0.x'
        shell: bash
        run: ./src/EggEncoder.AotSmokeTest/bin/Release/net10.0/win-x64/publish/EggEncoder.AotSmokeTest.exe
